function normalizeStockName(value){
  return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
}
function addMissingDefaultStock(data){
  const existing=new Set((data.stock||[]).map(item=>normalizeStockName(item.name)));
  for(const item of DEFAULT_STOCK){
    const key=normalizeStockName(item.name);
    if(existing.has(key))continue;
    const total=(Number(item.packageQty)||0)*(Number(item.partsPerPackage)||1);
    data.stock.push({...item,id:uid(),current:total,bought:total});
    existing.add(key);
  }
}

const emptyDB=()=>({version:3,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),lastBackupAt:null,stock:[],purchases:[],recipes:[],products:[],sales:[],expenses:[],clients:[],deliveries:[],snapshots:[]});
let db=load(); let tab='dashboard'; let modal=null; let query=''; let navScroll=0;
function load(){try{
const raw=localStorage.getItem(K),base=emptyDB(),saved=raw?JSON.parse(raw):{},data={...base,...saved};
for(const key of ['stock','purchases','recipes','products','sales','expenses','clients','deliveries','snapshots']){
  if(!Array.isArray(data[key]))data[key]=[];
  data[key]=data[key].filter(x=>x&&typeof x==='object');
}
addMissingDefaultStock(data);
data.stock=data.stock.map(x=>({...x,id:x.id||uid(),name:String(x.name||'Item sem nome'),unit:String(x.unit||'un'),current:Number(x.current)||0,minStock:Math.max(1,Number(x.minStock)||0),bought:Number(x.bought)||0,totalCost:Number(x.totalCost)||0,partsPerPackage:Number(x.partsPerPackage)||1,packageQty:Number(x.packageQty)||0,packageLabel:String(x.packageLabel||'unidade'),category:String(x.category||'Ingrediente')}));
data.recipes=data.recipes.map(x=>({...x,id:x.id||uid(),name:String(x.name||'Receita sem nome'),ingredients:Array.isArray(x.ingredients)?x.ingredients:[],yieldQty:Number(x.yieldQty)||1}));
data.products=data.products.map(x=>({...x,id:x.id||uid(),name:String(x.name||'Produto sem nome'),price:Number(x.price)||0,stock:Number(x.stock)||0}));
data.sales=data.sales.map(x=>({...x,id:x.id||uid(),date:String(x.date||new Date().toISOString().slice(0,10)),productName:String(x.productName||'Produto'),qty:Number(x.qty)||0,unitPrice:Number(x.unitPrice)||0,discount:Number(x.discount)||0}));
data.clients=data.clients.map(x=>({...x,id:x.id||uid(),name:String(x.name||'Cliente sem nome')}));
data.deliveries=data.deliveries.map(x=>({...x,id:x.id||uid(),date:String(x.date||new Date().toISOString().slice(0,10)),clientName:String(x.clientName||'Cliente'),item:String(x.item||'Pedido'),status:String(x.status||'Pendente')}));
data.expenses=data.expenses.map(x=>({...x,id:x.id||uid(),date:String(x.date||new Date().toISOString().slice(0,10)),description:String(x.description||'Despesa'),amount:Number(x.amount)||0}));
return data
}catch(e){console.error(e);return emptyDB()}}
function save(msg='Salvo automaticamente'){const previous=localStorage.getItem(K);if(previous)localStorage.setItem(UNDO_K,previous);db.updatedAt=new Date().toISOString();localStorage.setItem(K,JSON.stringify(db));dailySnapshot();render();toast(msg)}
function dailySnapshot(){try{const day=new Date().toISOString().slice(0,10), list=(db.snapshots||[]),last=list.length?list[list.length-1]:null;if(!last||last.day!==day){const copy={...db,snapshots:[]};db.snapshots=[...(db.snapshots||[]),{day,data:copy}].slice(-10);localStorage.setItem(K,JSON.stringify(db))}}catch(e){console.warn(e)}}

const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=n=>(Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const dateBR=s=>s?new Date(s+'T00:00:00').toLocaleDateString('pt-BR'):'—';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function nav(){return [['dashboard','Painel'],['stock','Estoque'],['purchases','Compras'],['recipes','Receitas'],['products','Produtos'],['sales','Vendas'],['clients','Clientes/Locais'],['agenda','Agenda'],['expenses','Despesas'],['safety','Segurança']].map(([id,l])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${l}</button>`).join('')}
function go(t){const n=document.getElementById('navBar');if(n)navScroll=n.scrollLeft;tab=t;query='';render()}
function metrics(){const revenue=db.sales.reduce((s,x)=>s+(+x.qty||0)*(+x.unitPrice||0)-(+x.discount||0),0);const expenses=db.expenses.reduce((s,x)=>s+(+x.amount||0),0);const stockCost=db.stock.reduce((s,x)=>s+(+x.totalCost||0),0);return{revenue,expenses,stockCost,profit:revenue-expenses}}
function hasLowStock(x){const min=Number(x.minStock)||0;return min>0&&(Number(x.current)||0)<=min}
function stockStatus(x){const current=Number(x.current)||0,min=Number(x.minStock)||0;if(min<=0)return '<span class="pill">Sem alerta</span>';if(current<=0)return '<span class="pill bad">Sem estoque</span>';if(current<=min)return '<span class="pill bad">Repor</span>';return '<span class="pill ok">Normal</span>'}
function appHeader(){return `<header class="top"><div class="brand"><div><h1>Sweet Charm</h1><small>Estoque, produção, vendas e clientes em um só lugar</small></div><div class="toolbar"><button class="btn small" onclick="openForm('purchase')">🛒 Compra rápida</button><button class="btn alt small" onclick="undoLast()">↶ Desfazer</button><button class="btn alt small" onclick="exportBackup()">⬇ Backup</button><button class="btn alt small" onclick="document.getElementById('importFile').click()">⬆ Restaurar</button></div></div><nav id="navBar" class="nav">${nav()}</nav></header>`}
function layout(content){return `${appHeader()}<main class="wrap">${content}<div class="footer">Sweet Charm · dados salvos neste navegador · versão 2.6 · busca de ingredientes</div></main>${modal?modalHtml():''}`}

function stockUnitCost(x){return (+x.bought||0)>0?(+x.totalCost||0)/(+x.bought||1):0}
function recipeCost(r){return (r.ingredients||[]).reduce((sum,i)=>{const s=db.stock.find(x=>x.id===i.stockId);return sum+(s?stockUnitCost(s)*(+i.qty||0):0)},0)}
function recipePossibleBatches(r){const vals=(r.ingredients||[]).map(i=>{const s=db.stock.find(x=>x.id===i.stockId);return s&&(+i.qty||0)>0?Math.floor((+s.current||0)/(+i.qty||1)):0});return vals.length?Math.max(0,Math.min(...vals)):0}
function todayISO(){return new Date().toISOString().slice(0,10)}
function undoLast(){const raw=localStorage.getItem(UNDO_K);if(!raw)return alert('Ainda não existe uma alteração para desfazer.');if(!confirm('Desfazer a última alteração?'))return;const current=localStorage.getItem(K);try{db={...emptyDB(),...JSON.parse(raw)};if(current)localStorage.setItem(UNDO_K,current);localStorage.setItem(K,JSON.stringify(db));render();toast('Última alteração desfeita')}catch(e){alert('Não foi possível desfazer.')}}
function repeatPurchase(id){const p=db.purchases.find(x=>x.id===id);if(!p)return;let changed=0;for(const it of p.items||[]){const s=db.stock.find(x=>x.id===it.stockId);if(!s)continue;s.packageQty=(+s.packageQty||0)+(+it.packages||0);s.bought=(+s.bought||0)+(+it.parts||0);s.current=(+s.current||0)+(+it.parts||0);s.totalCost=(+s.totalCost||0)+(+it.cost||0);changed++}if(!changed)return alert('Os itens dessa compra não existem mais no estoque.');db.purchases.push({...p,id:uid(),date:todayISO(),repeatedFrom:id});save('Compra repetida e estoque atualizado')}

function draftKey(){return modal?`${modal.type}:${modal.id||'new'}`:''}
function saveDraftFromForm(form){if(!modal||modal.id)return;try{const data={key:draftKey(),values:{}};form.querySelectorAll('input,select,textarea').forEach(el=>{if(el.name)data.values[el.name]=el.value});localStorage.setItem(DRAFT_K,JSON.stringify(data));const s=document.getElementById('draftStatus');if(s)s.textContent='Rascunho salvo automaticamente'}catch(e){}}
function restoreDraftToForm(){if(!modal||modal.id)return;try{const raw=localStorage.getItem(DRAFT_K);if(!raw)return;const d=JSON.parse(raw);if(d.key!==draftKey())return;const form=document.querySelector('.modal form');if(!form)return;Object.keys(d.values||{}).forEach(name=>{const el=form.elements[name];if(el&&(!el.value||el.value==='0'))el.value=d.values[name]});const s=document.getElementById('draftStatus');if(s)s.textContent='Rascunho anterior recuperado'}catch(e){}}

}else if(t==='deliveries'){
title=id?'Editar compromisso':'Novo compromisso';
body=`<div class="formgrid">${field('date','Data','date',x.date||new Date().toISOString().slice(0,10),'required')}${field('time','Hora','time',x.time)}</div>${field('clientName','Cliente/local','text',x.clientName,'required')}${field('item','Pedido/fornecimento','text',x.item,'required')}<label class="field"><span>Status</span><select name="status">${['Pendente','Produzido','Entregue','Cancelado'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></label>`;
}else if(t==='expenses'){
title=id?'Editar despesa':'Nova despesa';
body=`<div class="formgrid">${field('date','Data','date',x.date||new Date().toISOString().slice(0,10),'required')}${field('amount','Valor','number',x.amount,'step="0.01" required')}</div>${field('description','Descrição','text',x.description,'required')}${field('category','Categoria','text',x.category||'Outro')}`;
}
const html=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><b>${title}</b><button class="btn alt small" onclick="closeModal()">✕</button></div><div class="modalbody"><form onsubmit="submitForm(event)">${body}<div id="draftStatus" class="hint" style="margin-top:10px">As informações digitadas são salvas automaticamente como rascunho.</div><div class="toolbar" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn alt" onclick="closeModal()">Cancelar</button><button class="btn">${t==='purchase'?'Salvar compra':'Salvar'}</button></div></form></div></div></div>`;setTimeout(()=>{if(t==='purchase'&&document.getElementById('purchaseRows')&&!document.querySelector('.purchase-row'))addPurchaseRow();const form=document.querySelector('.modal form');if(form){restoreDraftToForm();form.addEventListener('input',()=>saveDraftFromForm(form));form.addEventListener('change',()=>saveDraftFromForm(form))}},0);return html}
function filterRecipeIngredients(value){
  const q=String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  document.querySelectorAll('#ingredientList .ingredient-item').forEach(el=>{
    const text=String(el.dataset.search||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    el.classList.toggle('hide-by-search',q!==''&&!text.includes(q));
  });
}
function submitForm(e){e.preventDefault();const fd=new FormData(e.target);const f=Object.fromEntries(fd);const t=modal.type,id=modal.id;
if(t==='purchase'){
const rows=[...e.target.querySelectorAll('.purchase-row')];const items=[];for(const row of rows){const itemId=row.querySelector('[name="purchaseItem"]').value;const packages=Number(String(row.querySelector('[name="purchasePackages"]').value).replace(',','.'));const cost=Number(String(row.querySelector('[name="purchaseCost"]').value).replace(',','.'));if(!itemId&&!packages&&!cost)continue;if(!itemId||!(packages>0)||!(cost>=0))return alert('Preencha item, quantidade de embalagens e valor em todas as linhas usadas.');const item=db.stock.find(x=>x.id===itemId);if(!item)return alert('Um dos itens não foi encontrado.');const parts=packages*(+item.partsPerPackage||1);item.packageQty=(+item.packageQty||0)+packages;item.bought=(+item.bought||0)+parts;item.current=(+item.current||0)+parts;item.totalCost=(+item.totalCost||0)+cost;items.push({stockId:item.id,name:item.name,packages,parts,cost})}if(!items.length)return alert('Adicione pelo menos um item à compra.');db.purchases.push({id:uid(),date:f.date,store:f.store||'',items,total:items.reduce((s,x)=>s+x.cost,0)});clearDraft();modal=null;return save(`Compra registrada: ${items.length} item(ns) atualizados`);
}else if(t==='stock'){
for(const k of ['packageQty','partsPerPackage','totalCost','minStock'])f[k]=+f[k]||0;
const totalParts=(f.packageQty||0)*(f.partsPerPackage||1);
f.bought=totalParts;
const currentRaw=fd.get('current');
f.current=currentRaw===''?(id?((db.stock.find(x=>x.id===id)||{}).current||0):totalParts):(+currentRaw||0);
if(!f.packageLabel)f.packageLabel='unidade';
if(!f.unit)f.unit='un';
}else if(t==='recipes'){
f.yieldQty=+f.yieldQty||1;
f.ingredients=[];
for(const s of db.stock){const q=Number(fd.get('ing_'+s.id)||0);if(q>0)f.ingredients.push({stockId:s.id,qty:q})}
if(!f.ingredients.length)return alert('Informe pelo menos um ingrediente usado na receita.');
}else if(t==='products'){
f.price=+f.price||0;f.stock=+f.stock||0;
}else if(t==='sales'){
const p=db.products.find(p=>p.id===f.productId);if(!p)return alert('Selecione um produto.');
f.qty=+f.qty||0;f.unitPrice=+f.unitPrice||0;f.discount=+f.discount||0;f.productName=p.name;p.stock=(+p.stock||0)-f.qty;
}else if(t==='expenses')f.amount=+f.amount||0;
if(id){db[t]=db[t].map(x=>x.id===id?{...x,...f}:x)}else{db[t].push({...f,id:uid()})}
clearDraft();modal=null;save()}
let purchaseRowSeq=0;
function purchaseRowHtml(){purchaseRowSeq++;return `<div class="purchase-row card" style="padding:12px;margin-bottom:10px;box-shadow:none"><div class="formgrid" style="grid-template-columns:2fr 1fr 1fr auto;align-items:end"><label class="field"><span>Item comprado</span><select name="purchaseItem" required><option value="">Selecione</option>${db.stock.map(s=>`<option value="${s.id}">${esc(s.name)} — ${num(s.partsPerPackage||1)} ${esc(s.unit)} por ${esc(s.packageLabel||'embalagem')}</option>`).join('')}</select></label><label class="field"><span>Embalagens</span><input name="purchasePackages" type="number" step="any" min="0" placeholder="Ex.: 2" required></label><label class="field"><span>Valor pago</span><input name="purchaseCost" type="number" step="0.01" min="0" placeholder="R$" required></label><button type="button" class="btn danger small" onclick="removePurchaseRow(this)" title="Remover linha">✕</button></div></div>`}
function addPurchaseRow(){const box=document.getElementById('purchaseRows');if(box)box.insertAdjacentHTML('beforeend',purchaseRowHtml())}
function removePurchaseRow(btn){const rows=document.querySelectorAll('.purchase-row');if(rows.length<=1){btn.closest('.purchase-row').querySelectorAll('input,select').forEach(x=>x.value='');return}btn.closest('.purchase-row').remove()}
function del(t,id){if(!confirm('Tem certeza que deseja excluir?'))return;db[t]=db[t].filter(x=>x.id!==id);save('Registro excluído')}
function consumeStock(id){const x=db.stock.find(x=>x.id===id);if(!x)return;const q=prompt(`Quanto foi usado de ${x.name}? Digite em ${x.unit}:`);if(q===null)return;const qn=Number(String(q).replace(',','.'));if(!(qn>0))return alert('Digite uma quantidade maior que zero.');if(qn>(+x.current||0)&&!confirm(`Você tem ${num(x.current)} ${x.unit}. Deseja deixar o estoque negativo mesmo assim?`))return;x.current=(+x.current||0)-qn;save('Uso registrado no estoque')}
function produceRecipe(id){const r=db.recipes.find(x=>x.id===id);if(!r)return;const raw=prompt(`Quantos preparos completos de “${r.name}” você vai fazer?`,'1');if(raw===null)return;const batches=Number(String(raw).replace(',','.'));if(!(batches>0))return alert('Quantidade inválida.');const missing=[];for(const i of r.ingredients||[]){const s=db.stock.find(x=>x.id===i.stockId);const need=(+i.qty||0)*batches;if(!s||(+s.current||0)<need)missing.push(`${s?s.name:'Ingrediente removido'}: precisa ${num(need)}, tem ${num((s&&s.current)||0)}`)}if(missing.length&&!confirm('Estoque insuficiente:\n\n'+missing.join('\n')+'\n\nContinuar mesmo assim?'))return;for(const i of r.ingredients||[]){const s=db.stock.find(x=>x.id===i.stockId);if(s)s.current=(+s.current||0)-(+i.qty||0)*batches}const p=db.products.find(x=>x.id===r.productId);if(p)p.stock=(+p.stock||0)+(+r.yieldQty||0)*batches;save(`Produção registrada: ${num((+r.yieldQty||0)*batches)} unidade(s)`)}
function restock(id){const x=db.stock.find(x=>x.id===id);const q=prompt(`Quantidade adicionada (${x.unit}):`);if(q===null)return;const c=prompt('Valor pago nessa compra (R$):');if(c===null)return;const qn=Number(String(q).replace(',','.')),cn=Number(String(c).replace(',','.'));if(!(qn>0)||!(cn>=0))return alert('Valores inválidos.');x.bought=(+x.bought||0)+qn;x.current=(+x.current||0)+qn;x.totalCost=(+x.totalCost||0)+cn;save('Reposição registrada')}
function deleteSale(id){const s=db.sales.find(x=>x.id===id);if(!s||!confirm('Excluir a venda e devolver a quantidade ao estoque do produto?'))return;const p=db.products.find(p=>p.id===s.productId);if(p)p.stock=(+p.stock||0)+(+s.qty||0);db.sales=db.sales.filter(x=>x.id!==id);save('Venda excluída')}
function exportBackup(){db.lastBackupAt=new Date().toISOString();localStorage.setItem(K,JSON.stringify(db));const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sweet-charm-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);render();toast('Backup baixado. Guarde no Drive e em outro lugar.')}
function importBackup(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.stock)||!Array.isArray(d.sales))throw Error();if(confirm('Isso substituirá os dados atuais. Continuar?')){db={...emptyDB(),...d,updatedAt:new Date().toISOString()};localStorage.setItem(K,JSON.stringify(db));render();toast('Backup restaurado com sucesso')}}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(file)}
function restoreSnapshot(){const ss=db.snapshots||[];if(!ss.length)return alert('Ainda não existem cópias internas.');const opts=ss.map((s,i)=>`${i+1} - ${s.day}`).join('\n');const n=prompt('Digite o número da cópia que deseja restaurar:\n'+opts);const s=ss[Number(n)-1];if(!s)return;if(confirm('Restaurar essa cópia?')){const keep=db.snapshots;db={...emptyDB(),...s.data,snapshots:keep,updatedAt:new Date().toISOString()};localStorage.setItem(K,JSON.stringify(db));render();toast('Cópia interna restaurada')}}
function exportCSV(){const head=['data','produto','quantidade','preco_unitario','desconto','pagamento'];const lines=[head.join(';'),...db.sales.map(s=>[s.date,s.productName,s.qty,s.unitPrice,s.discount||0,s.payment||''].map(v=>`"${String(v).split('"').join('""')}"`).join(';'))];const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vendas-sweet-charm.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){const oldNav=document.getElementById('navBar');if(oldNav)navScroll=oldNav.scrollLeft;let content=tab==='dashboard'?dashboard():tab==='stock'?stockPage():tab==='purchases'?purchasesPage():tab==='recipes'?recipesPage():tab==='products'?productsPage():tab==='sales'?salesPage():tab==='clients'?clientsPage():tab==='agenda'?agendaPage():tab==='expenses'?expensesPage():safetyPage();document.getElementById('app').innerHTML=layout(content);requestAnimationFrame(()=>{const n=document.getElementById('navBar');if(!n)return;n.scrollLeft=navScroll;const active=n.querySelector('.active');if(active){const left=active.offsetLeft,right=left+active.offsetWidth;if(left<n.scrollLeft)n.scrollLeft=Math.max(0,left-10);else if(right>n.scrollLeft+n.clientWidth)n.scrollLeft=right-n.clientWidth+10;navScroll=n.scrollLeft;}})}
document.getElementById('importFile').addEventListener('change',e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value='' });
window.addEventListener('error',e=>{console.error('Sweet Charm:',e.message,e.error);e.preventDefault()});
dailySnapshot();render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
